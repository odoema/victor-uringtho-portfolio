# One-click publishing: commit to main → the public site (docs/) is rebuilt
# and the Apps Script web app is updated in place (same URL, new version).
name: Publish

on:
  push:
    branches: [main]
    paths: ['src/**', 'build_pages.js', 'prerender.py', '.github/workflows/publish.yml']
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEPLOYMENT_ID: AKfycbwHq8KDHJHN5febSkLDoDGv4JFzNwCN89eAxcX9ACZRN0vtn-PPfbUSE5dxvYoIqiHDiQ

jobs:
  website:
    name: Rebuild victoruringtho.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install page tools
        run: |
          pip install playwright==1.47.0 pillow
          python -m playwright install --with-deps chromium
      - name: Build and prerender
        run: |
          node build_pages.js
          python prerender.py
      - name: Commit the rebuilt site
        run: |
          if git diff --quiet -- docs; then echo "Site unchanged"; exit 0; fi
          git config user.name  "publish-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild site from ${GITHUB_SHA::7}"
          git push

  apps-script:
    name: Update the Apps Script web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the login secret is set
        env: { CLASPRC_JSON: '${{ secrets.CLASPRC_JSON }}' }
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Add the CLASPRC_JSON secret first (see guide/ONE_CLICK_PUBLISHING.md)"; exit 1; fi
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Push code and update the live deployment
        env: { CLASPRC_JSON: '${{ secrets.CLASPRC_JSON }}' }
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          clasp push --force
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Auto ${GITHUB_SHA::7}: $(git log -1 --pretty=%s | cut -c1-80)"
          rm -f "$HOME/.clasprc.json"
