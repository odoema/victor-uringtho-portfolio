<script>
/* ==========================================================================
   Client renderer. All content arrives in window.VU_DATA (from the Sheet).
   Nothing about Victor is hard-coded here — edit the Sheet, not this file.
   ========================================================================== */
(function () {
  'use strict';
  var D = window.VU_DATA || {};
  var P = D.PROFILE || {};
  var PREVIEW = !!(D.meta && D.meta.preview);
  var A = window.VU_ASSETS || {};
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PH_RE = /\[(ADD|CONFIRM)[^\]]*\]/gi;

  /* ---------------- helpers ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function list(name) { return Array.isArray(D[name]) ? D[name] : []; }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function isPh(v) { return PH_RE.test(String(v || '')) && !(PH_RE.lastIndex = 0); }
  /** Escaped text; in preview mode placeholders are highlighted. */
  function t(v) {
    var s = esc(v);
    return PREVIEW ? s.replace(PH_RE, function (m) { return '<span class="ph">' + m + '</span>'; }) : s;
  }
  function has(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }
  function paras(v) {
    return String(v || '').split(/\n\s*\n/).filter(has).map(function (p) { return '<p>' + t(p.trim()) + '</p>'; }).join('');
  }
  function splitList(v) { return String(v || '').split(/\s*,\s*/).filter(has); }
  function slug(v) { return String(v || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  /** image field → usable src. Accepts asset:name, Drive file ID, Drive link or any URL. */
  function img(v, w) {
    if (!has(v) || isPh(v)) return '';
    v = String(v).trim();
    if (v.indexOf('asset:') === 0) return A[v.slice(6)] || '';
    var m = v.match(/\/d\/([\w-]{20,})/) || v.match(/[?&]id=([\w-]{20,})/);
    if (m) return 'https://lh3.googleusercontent.com/d/' + m[1] + '=w' + (w || 1200);
    if (/^[\w-]{25,}$/.test(v)) return 'https://lh3.googleusercontent.com/d/' + v + '=w' + (w || 1200);
    return v;
  }

  /* ---------------- talking to the Sheet (Apps Script page or GitHub Pages) ---------------- */
  function gsr() { return window.google && google.script && google.script.run; }
  function apiUrl() { return window.VU_API ? String(window.VU_API).split('?')[0] : ''; }
  /** Request with a reply (sign-ups, enquiries). done(null) means "could not reach the Sheet". */
  function api(payload, done) {
    done = done || function () {};
    if (gsr()) { google.script.run.withSuccessHandler(done).withFailureHandler(function () { done(null); }).siteAction(payload); return; }
    if (!apiUrl()) { done(null); return; }
    fetch(apiUrl(), { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); }).then(done).catch(function () { done(null); });
  }
  /** Fire-and-forget (visit and click counts). */
  function beacon(payload) {
    if (PREVIEW) return;
    if (gsr()) { try { google.script.run.siteAction(payload); } catch (e) {} return; }
    var u = apiUrl(), body = JSON.stringify(payload); if (!u) return;
    try { if (navigator.sendBeacon && navigator.sendBeacon(u, new Blob([body], { type: 'text/plain' }))) return; } catch (e) {}
    try { fetch(u, { method: 'POST', mode: 'no-cors', keepalive: true, body: body }); } catch (e) {}
  }
  /* Where a visitor came from, in plain words. group feeds the STATS totals; name is shown in the alert. */
  function sourceDetail() {
    var q = location.search, r = document.referrer || '', ua = navigator.userAgent, host = '';
    try { host = r ? new URL(r).hostname.replace(/^www\.|^m\.|^l\.|^lm\./, '') : ''; } catch (e) {}
    if (host === location.hostname) host = '';
    var utm = decodeURIComponent((q.match(/utm_source=([^&]+)/) || [])[1] || '').toLowerCase();
    var NAMES = { whatsapp: 'WhatsApp', facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', x: 'X (Twitter)', twitter: 'X (Twitter)', linkedin: 'LinkedIn', email: 'Email', sms: 'SMS' };
    var SOCIAL = [[/facebook\.com|fb\.com|fb\.me/, 'Facebook'], [/instagram\.com/, 'Instagram'], [/tiktok\.com/, 'TikTok'], [/youtube\.com|youtu\.be/, 'YouTube'],
      [/t\.co$|twitter\.com|x\.com/, 'X (Twitter)'], [/linkedin\.com|lnkd\.in/, 'LinkedIn'], [/whatsapp\.com|wa\.me/, 'WhatsApp'], [/snapchat\.com/, 'Snapchat'], [/telegram|t\.me/, 'Telegram']];
    var SEARCH = [[/google\./, 'Google Search'], [/bing\.com/, 'Bing'], [/yahoo\./, 'Yahoo'], [/duckduckgo/, 'DuckDuckGo'], [/ecosia/, 'Ecosia'], [/yandex/, 'Yandex']];
    var MAIL = [[/mail\.google|com\.google\.android\.gm/, 'Gmail'], [/outlook|live\.com|office\.com/, 'Outlook'], [/mail\.yahoo/, 'Yahoo Mail']];
    var hit = function (list) { for (var i = 0; i < list.length; i++) if (list[i][0].test(host || r)) return list[i][1]; return ''; };
    var n;
    if (utm) return { group: 'social', name: (NAMES[utm] || utm) + ' — a link from Victor’s posts' };
    if ((n = hit(MAIL))) return { group: 'other', name: n + ' — a link in an email' };
    if ((n = hit(SEARCH))) return { group: 'search', name: n + ' — found the site by searching' };
    if ((n = hit(SOCIAL))) return { group: 'social', name: n };
    // Apps that open links inside themselves say who they are in the browser name
    if (/FBAN|FBAV|FB_IAB/.test(ua)) return { group: 'social', name: 'Facebook app' };
    if (/Instagram/.test(ua)) return { group: 'social', name: 'Instagram app' };
    if (/TikTok|musical_ly|Bytedance/i.test(ua)) return { group: 'social', name: 'TikTok app' };
    if (/LinkedInApp/.test(ua)) return { group: 'social', name: 'LinkedIn app' };
    if (/Snapchat/.test(ua)) return { group: 'social', name: 'Snapchat app' };
    if (/WhatsApp/i.test(ua)) return { group: 'social', name: 'WhatsApp' };
    if (host) return { group: 'other', name: 'Another website: ' + host };
    return { group: 'other', name: 'Direct — typed the address, used a bookmark, or tapped a link in WhatsApp, SMS or email (these apps don’t say which)' };
  }
  function trafficSource() { return sourceDetail().group; }
  function trackVisit() {
    // ?me=1 once on your own phone/laptop and your visits stop counting (?me=0 to undo)
    try {
      var me = (location.search.match(/[?&]me=([01])/) || [])[1];
      if (me === '1') localStorage.setItem('vu_me', '1'); if (me === '0') localStorage.removeItem('vu_me');
      if (localStorage.getItem('vu_me')) return;
    } catch (e) {}
    if (navigator.webdriver || /bot|crawl|spider|slurp|lighthouse|headless|preview/i.test(navigator.userAgent)) return;
    try { if (sessionStorage.getItem('vu_seen')) return; sessionStorage.setItem('vu_seen', '1'); } catch (e) {}
    var ua = navigator.userAgent, ref = '';
    try { ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : ''; } catch (e) {}
    if (ref === location.hostname) ref = '';
    var tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    var land = (location.hash || '').replace('#', ''), sec = land && document.getElementById(land);
    var head = sec && sec.querySelector('h2,h3');
    var sd = sourceDetail();
    var hit = { a: 'hit', src: sd.group, srcName: sd.name, ref: ref, utm: (location.search.match(/utm_source=([^&]+)/) || [])[1] || '',
      land: head ? head.textContent.trim().slice(0, 60) : (land || 'Home'),
      dev: /iPad|Tablet/i.test(ua) ? 'Tablet' : /Mobi|Android|iPhone/i.test(ua) ? 'Phone' + (/Android/i.test(ua) ? ' (Android)' : /iPhone/i.test(ua) ? ' (iPhone)' : '') : 'Computer',
      lang: navigator.language || '', tz: tz, who: knownVisitor() };
    // Approximate location + network from the IP address (see the privacy notice). Gives up after 2.5 s.
    var sent = false, send = function () { if (!sent) { sent = true; beacon(hit); } };
    setTimeout(send, 2500);
    try {
      fetch('https://get.geojs.io/v1/ip/geo.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (g) {
        hit.ip = g.ip; hit.city = g.city; hit.region = g.region; hit.country = g.country; hit.isp = g.organization_name;
        send();
      }).catch(send);
    } catch (e) { send(); }
  }
  /* People who joined Friends of Victor or sent an enquiry are remembered on their own device (see privacy notice) */
  function rememberVisitor(name, how) {
    if (!has(name)) return;
    try { localStorage.setItem('vu_who', JSON.stringify({ name: String(name).trim().slice(0, 60), how: how, since: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) })); } catch (e) {}
  }
  function knownVisitor() { try { return JSON.parse(localStorage.getItem('vu_who') || 'null'); } catch (e) { return null; } }

  /* ---------------- players (lazy — nothing loads until tapped) ---------------- */
  function spotifyEmbed(url) {
    var m = String(url || '').match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(album|track|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);
    if (!m) return null;
    return { src: 'https://open.spotify.com/embed/' + m[1] + '/' + m[2] + '?utm_source=generator&theme=0',
             h: m[1] === 'track' || m[1] === 'episode' ? 152 : 352, label: 'Play on Spotify' };
  }
  function youtubeEmbed(url) {
    var m = String(url || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? { src: 'https://www.youtube-nocookie.com/embed/' + m[1], h: 0, video: true, label: 'Watch on YouTube' } : null;
  }
  function audioEmbed(url) {
    url = String(url || '');
    var d = url.match(/\/d\/([\w-]{20,})/) || url.match(/[?&]id=([\w-]{20,})/);
    if (d) return { src: 'https://drive.google.com/file/d/' + d[1] + '/preview', h: 110, label: 'Play audio' };
    if (/soundcloud\.com/.test(url)) return { src: 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + '&color=%23c98d4b&visual=false', h: 166, label: 'Play on SoundCloud' };
    if (/\.(mp3|m4a|ogg|wav)(\?|$)/i.test(url)) return { native: url, label: 'Play audio' };
    return null;
  }
  // audio_url may hold one link, or an album: one track per line as "Title | URL"
  function parseTracks(v) {
    return String(v || '').split(/\n+/).map(function (l) {
      l = l.trim(); if (!l || isPh(l)) return null;
      var i = l.lastIndexOf('|'), title = i > -1 ? l.slice(0, i).trim() : '', url = (i > -1 ? l.slice(i + 1) : l).trim();
      if (!/\.(mp3|m4a|ogg|wav)(\?|$)/i.test(url)) return null;
      if (!title) title = decodeURIComponent(url.split('/').pop().replace(/\.\w+$/, '')).replace(/^\d+[-_ ]*/, '').replace(/[-_]+/g, ' ');
      return { t: title, u: url };
    }).filter(Boolean);
  }
  function playerFor(item) {
    var tr = parseTracks(item.audio_url);
    if (tr.length > 1) return { tracks: tr, label: 'Play the album · ' + tr.length + ' tracks' };
    if (has(item.spotify_url) && !isPh(item.spotify_url)) { var s = spotifyEmbed(item.spotify_url); if (s) return s; }
    if (has(item.audio_url) && !isPh(item.audio_url)) { var a = audioEmbed(item.audio_url); if (a) return a; }
    if (has(item.youtube_url) && !isPh(item.youtube_url)) { var y = youtubeEmbed(item.youtube_url); if (y) return y; }
    return null;
  }
  function mountPlayer(btn) {
    var cfg = JSON.parse(btn.getAttribute('data-player'));
    var box = btn.parentNode, el;
    if (cfg.tracks) { el = albumPlayer(cfg.tracks, btn.getAttribute('data-title')); box.replaceChild(el, btn); playTrack(el, 0); return; }
    if (cfg.native) {
      el = document.createElement('audio');
      el.controls = true; el.preload = 'none'; el.src = cfg.native; el.className = 'audio-native';
    } else {
      el = document.createElement('iframe');
      el.className = 'embed'; el.src = cfg.src; el.loading = 'lazy';
      el.title = btn.getAttribute('data-title') || 'Audio player';
      el.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
      if (cfg.video) el.style.aspectRatio = '16/9'; else el.height = cfg.h;
    }
    box.replaceChild(el, btn);
    if (el.play) el.play().catch(function () {});
  }

  function albumPlayer(tracks, album) {
    var w = document.createElement('div');
    w.className = 'album-player';
    w.innerHTML = '<div class="now"><span class="eq on" aria-hidden="true"><i></i><i></i><i></i></span><span class="now-t"></span></div>' +
      '<audio class="audio-native" controls preload="none"></audio>' +
      '<ol class="tracklist" aria-label="' + esc(album || 'Album') + ' tracklist">' + tracks.map(function (x, i) {
        return '<li><button type="button" data-i="' + i + '"><span class="n">' + (i < 9 ? '0' : '') + (i + 1) + '</span><span class="tt">' + esc(x.t) + '</span></button></li>';
      }).join('') + '</ol>';
    w._tracks = tracks;
    var au = w.querySelector('audio');
    au.addEventListener('ended', function () { if (w._i + 1 < tracks.length) playTrack(w, w._i + 1); });
    au.addEventListener('play', function () {
      w.classList.add('playing');
      $$('audio').forEach(function (o) { if (o !== au && !o.paused) o.pause(); });
    });
    au.addEventListener('pause', function () { w.classList.remove('playing'); });
    w.querySelector('.tracklist').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-i]'); if (b) playTrack(w, +b.getAttribute('data-i'));
    });
    return w;
  }
  function playTrack(w, i) {
    var au = w.querySelector('audio'), x = w._tracks[i];
    w._i = i; au.src = x.u;
    w.querySelector('.now-t').textContent = (i + 1) + '. ' + x.t;
    $$('.tracklist button', w).forEach(function (b, j) { b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    au.play().catch(function () {});
  }

  /* ---------------- filters ---------------- */
  function buildFilters(host, values, onPick) {
    if (!host) return;
    values = values.filter(function (v, i, a) { return has(v) && !isPh(v) && a.indexOf(v) === i; });
    if (values.length < 2) { host.hidden = true; return; }
    host.innerHTML = ['All'].concat(values).map(function (v, i) {
      return '<button class="chip" type="button" aria-pressed="' + (i === 0) + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
    }).join('');
    host.addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      $$('.chip', host).forEach(function (c) { c.setAttribute('aria-pressed', c === b); });
      onPick(b.getAttribute('data-v'));
    });
  }
  function applyFilter(cards, key, v) {
    cards.forEach(function (c) {
      var vals = (c.getAttribute(key) || '').split('|');
      var show = v === 'All' || vals.indexOf(v) > -1;
      c.hidden = !show;
      if (show && !REDUCED) { c.classList.remove('in'); requestAnimationFrame(function () { c.classList.add('in'); }); }
    });
  }

  /* ---------------- chord diagrams (chapter markers) ---------------- */
  var CHORDS = { C: 'x32010', G7: '320001', F: 'xx3211', D: 'xx0232', A: 'x02220', Am: 'x02210', Em: '022000', Dm: 'xx0231', E: '022100', Bm: 'x24432', B: 'x24442', G: '320003' };
  function chordSvg(name) {
    var shape = CHORDS[name]; if (!shape) return '';
    var x0 = 15, dx = 18, y0 = 30, dy = 24, s = '';
    s += '<g class="grid">';
    for (var i = 0; i < 6; i++) s += '<line x1="' + (x0 + i * dx) + '" y1="' + y0 + '" x2="' + (x0 + i * dx) + '" y2="' + (y0 + 4 * dy) + '"/>';
    for (var f = 1; f <= 4; f++) s += '<line x1="' + x0 + '" y1="' + (y0 + f * dy) + '" x2="' + (x0 + 5 * dx) + '" y2="' + (y0 + f * dy) + '"/>';
    s += '</g><line class="nut" x1="' + (x0 - 1) + '" y1="' + y0 + '" x2="' + (x0 + 5 * dx + 1) + '" y2="' + y0 + '"/>';
    shape.split('').forEach(function (c, i) {
      var x = x0 + i * dx;
      if (c === 'x') s += '<path class="mute" d="M' + (x - 4) + ' 12l8 8M' + (x + 4) + ' 12l-8 8"/>';
      else if (c === '0') s += '<circle class="open" cx="' + x + '" cy="16" r="4.5"/>';
      else s += '<circle class="dot" cx="' + x + '" cy="' + (y0 + (Number(c) - .5) * dy) + '" r="6.5"/>';
    });
    return '<svg class="chord" viewBox="0 0 120 130" role="img" aria-label="' + esc(name) + ' chord diagram">' + s + '</svg>';
  }

  /* ================= RENDER ================= */
  function renderHero() {
    var src = img(P.hero_image, 1600) || A.portrait;
    if (src) $('#heroPhoto').style.backgroundImage = 'url("' + src + '")';
    if (has(P.name_meaning)) $('#heroMeaning').innerHTML = 'Unyuthfua · “Show us our home”';
    $('#heroRoles').innerHTML = t(P.roles || '');
    $('#heroStatement').innerHTML = t(P.hero_statement || P.positioning || '');
    $('#footerRoles').innerHTML = t(P.roles || '');
    // load the lower photo only when the visitor gets near it
    if (A.casual) {
      var np = $('#nextPhoto'), setBg = function () { np.style.backgroundImage = 'url("' + A.casual + '")'; };
      if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { setBg(); io.disconnect(); } }, { rootMargin: '600px' }); io.observe(np); } else setBg();
    }
    var q = P.signature_quote;
    if (has(q)) $('#signatureQuote').innerHTML = '“' + t(q) + '”<cite>Victor Unyuthfua Uringtho</cite>';
    $('#year').textContent = new Date().getFullYear();
  }

  function renderStats() {
    var first = parseInt(P.first_chords_year, 10) || 1986;
    var liveBands = list('BANDS').filter(function (b) { return /live sound/i.test(b.relationship); }).length;
    var festivals = list('EVENTS').reduce(function (n, e) { return n + (parseInt(e.count, 10) || 0); }, 0);
    var album = list('MUSIC').filter(function (m) { return /album/i.test(m.type) && /^\d{4}$/.test(String(m.year)); })[0];
    var stats = [
      { n: new Date().getFullYear() - first, suffix: '', label: 'Years since his first chords (' + first + ')' },
      { n: 2000, suffix: '', label: 'First production & master copy', plain: true, prefix: 'c.' },
      album ? { n: Number(album.year), label: 'Debut album “' + album.title + '”', plain: true } : null,
      liveBands ? { n: liveBands, label: 'Bands mixed live' } : null,
      festivals ? { n: festivals, label: 'Blankets & Wine and Roast & Rhyme events' } : null
    ].filter(Boolean).slice(0, 4);
    $('#stats').innerHTML = stats.map(function (s) {
      return '<div class="stat reveal"><div class="stat-num">' + (s.prefix ? '<em>' + s.prefix + '</em>' : '') +
        '<span data-count="' + s.n + '" data-plain="' + (s.plain ? 1 : 0) + '">' + (REDUCED ? s.n : (s.plain ? s.n : 0)) + '</span></div>' +
        '<div class="stat-label">' + esc(s.label) + '</div></div>';
    }).join('');
  }

  function renderChapters() {
    $('#chapters').innerHTML = list('CHAPTERS').map(function (c, i) {
      var src = img(c.image, 1400);
      var fig = src ? '<figure class="chapter-figure"><img src="' + src + '" alt="' + esc(c.image_caption || c.title) + '" loading="lazy" decoding="async">' +
        (has(c.image_caption) ? '<figcaption>' + t(c.image_caption) + '</figcaption>' : '') + '</figure>'
        : (PREVIEW && isPh(c.image) ? '<p class="chapter-figure" style="padding:1rem">' + t(c.image) + '</p>' : '');
      return '<article class="chapter" id="ch-' + esc(c.id || i) + '">' +
        '<div class="chapter-side reveal">' + chordSvg(c.chord) +
          '<div><div class="chord-name">' + esc(c.chord || '') + '</div><div class="chapter-no">CHAPTER ' + String(i + 1).padStart(2, '0') + '</div>' +
          (has(c.period) ? '<div class="chapter-period">' + t(c.period) + '</div>' : '') + '</div></div>' +
        '<div class="chapter-main reveal"><h3>' + t(c.title) + '</h3>' +
          (has(c.summary) ? '<p class="chapter-summary">' + t(c.summary) + '</p>' : '') +
          '<div class="chapter-body">' + paras(c.body) + '</div>' +
          (has(c.quote) ? '<blockquote class="pull">“' + t(String(c.quote).replace(/“/g, '‘').replace(/”/g, '’')) + '”</blockquote>' : '') + fig +
        '</div></article>';
    }).join('');
  }

  function initials(n) { return String(n || '').split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }

  function renderPeople() {
    $('#peopleList').innerHTML = list('PEOPLE').map(function (p) {
      var src = img(p.image, 200);
      return '<article class="person reveal"><div class="person-initials">' + (src ? '<img src="' + src + '" alt="" loading="lazy">' : esc(initials(p.name))) + '</div>' +
        '<h3>' + t(p.name) + '</h3><span class="meta">' + t(p.relationship) + '</span><p>' + t(p.contribution) + '</p></article>';
    }).join('');
  }

  function renderMusic() {
    var items = list('MUSIC');
    var grid = $('#musicGrid');
    if (!items.length) { grid.innerHTML = '<p class="empty-note">New music is being added to the archive.</p>'; return; }
    grid.innerHTML = items.map(function (m) {
      if (!has(m.title)) m.title = has(m.artist) ? 'Production for ' + m.artist : 'Untitled recording';
      var cover = img(m.cover_image, 700);
      var roles = splitList(m.roles);
      var pl = playerFor(m);
      var links = [];
      if (has(m.spotify_url) && !isPh(m.spotify_url)) links.push('<a href="' + esc(m.spotify_url) + '" target="_blank" rel="noopener">Spotify ↗</a>');
      if (has(m.youtube_url) && !isPh(m.youtube_url)) links.push('<a href="' + esc(m.youtube_url) + '" target="_blank" rel="noopener">YouTube ↗</a>');
      if (has(m.related_chapter)) links.push('<a href="#ch-' + esc(m.related_chapter) + '">Read the story →</a>');
      return '<article class="release reveal" id="m-' + esc(m.id || slug(m.title)) + '" data-type="' + esc(m.type) + '" data-role="' + esc(roles.join('|')) + '">' +
        '<div class="cover">' + (cover ? '<img src="' + cover + '" alt="Artwork: ' + esc(m.title) + '" loading="lazy" decoding="async">' :
          '<div class="cover-gen" aria-hidden="true"><span class="vinyl"></span><span class="cy">' + esc(m.year || '') + '</span><span class="ct">' + esc(m.title || '') + '</span></div>') +
          (has(m.type) ? '<span class="type-badge">' + t(m.type) + '</span>' : '') + '</div>' +

  function renderContact() {
    var lines = [];

      return '<li>' + (isPh(s.url) ? t(s.platform + ' ' + s.url) : '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + t(s.label || s.platform) + ' ↗</a>') + '</li>';
    }).join('');
    $('#socials').innerHTML = soc; $('#footerSocials').innerHTML = soc;

    var form = $('#enquiryForm'), status = $('#formStatus');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = {}; new FormData(form).forEach(function (v, k) { data[k] = v; });
      if (!data.name || !data.message || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) { status.textContent = 'Please add your name, a valid email and a message.'; return; }

        // Static hosting (GitHub Pages): save to the Sheet through the web app; if that fails, use the visitor's email app
        var sbtn = form.querySelector('button'); sbtn.disabled = true; status.textContent = 'Sending…';
        data.a = 'enquiry';
        api(data, function (r) {
          sbtn.disabled = false;

          if (r && r.error) { status.textContent = r.error; return; }

      function mailtoFallback() {
        if (has(P.email) && !isPh(P.email)) {
          location.href = 'mailto:' + P.email + '?subject=' + encodeURIComponent('Website enquiry (' + (data.type || 'General') + ') — ' + data.name) +
            '&body=' + encodeURIComponent(data.message + '\n\n— ' + data.name + ' <' + data.email + '>');
          status.textContent = 'Opening your email app…';
        } else {
          status.textContent = 'Online enquiries open soon — please use the links above to reach Victor.';
        }
      }
      var btn = form.querySelector('button'); btn.disabled = true; status.textContent = 'Sending…';
      google.script.run.withSuccessHandler(function (r) {
        btn.disabled = false;
        if (r && r.ok) { rememberVisitor(data.name, 'Sent an enquiry'); form.reset(); status.textContent = 'Thank you — your message has been received.'; }
        else status.textContent = (r && r.error) || 'Something went wrong. Please try again.';
      }).withFailureHandler(function () { btn.disabled = false; status.textContent = 'Something went wrong. Please try again.'; })
        .submitEnquiry(data);
    });
  }

  /* ================= INTERACTION ================= */
  var lbIndex = 0;
  function openLightbox(i) {
    var shown = PHOTOS.filter(function (p) { return p._src; });
    var p = PHOTOS[i]; lbIndex = shown.indexOf(p);
    showLb(shown);
    var d = $('#lightbox'); if (!d.open) d.showModal();
  }
  function showLb(shown) {
    var p = shown[lbIndex]; if (!p) return;
    $('#lbImg').src = p._src; $('#lbImg').alt = p.alt || p.caption || '';
    var meta = [p.event, p.date, p.location, p.people].filter(function (v) { return has(v) && (PREVIEW || !isPh(v)); }).map(t).join(' · ');
    $('#lbCap').innerHTML = (has(p.caption) ? '<strong>' + t(p.caption) + '</strong>' : '') + meta;
  }
  function stepLb(dir) {
    var shown = PHOTOS.filter(function (p) { return p._src; });
    lbIndex = (lbIndex + dir + shown.length) % shown.length; showLb(shown);
  }
  function initLightbox() {
    var d = $('#lightbox');
    $('#lbClose').onclick = function () { d.close(); };
    $('#lbPrev').onclick = function () { stepLb(-1); };
    $('#lbNext').onclick = function () { stepLb(1); };
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
    d.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') stepLb(-1); if (e.key === 'ArrowRight') stepLb(1); });
    var sx = 0;
    d.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    d.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) stepLb(dx < 0 ? 1 : -1); });
  }

  /* Search across everything */
  var INDEX = [];
  function buildIndex() {
    function add(type, label, extra, href) { if (has(label) && !isPh(label)) INDEX.push({ type: type, label: String(label), hay: (label + ' ' + (extra || '')).toLowerCase(), href: href }); }
    list('CHAPTERS').forEach(function (c) { add('Story', c.title, c.period + ' ' + c.summary + ' ' + c.body, '#ch-' + c.id); });
    list('MUSIC').forEach(function (m) { add(m.type || 'Music', m.title, m.artist + ' ' + m.year + ' ' + m.roles, '#m-' + (m.id || slug(m.title))); });
    list('ARTISTS').forEach(function (a) { add('Artist', a.name, a.category + ' ' + a.roles + ' ' + a.project + ' ' + a.year, '#artists'); });
    list('BANDS').forEach(function (b) { add('Band', b.name, b.relationship + ' ' + b.role + ' ' + b.period, '#bands'); });
    list('EVENTS').forEach(function (e) { add('Event', e.title, e.category + ' ' + e.date + ' ' + e.location, '#events'); });
    list('MILESTONES').forEach(function (m) { add('Milestone', m.title, m.year + ' ' + m.description, '#milestones'); });
    list('PEOPLE').forEach(function (p) { add('Person', p.name, p.relationship + ' ' + p.contribution, '#people'); });
    list('SKILLS').forEach(function (s) { add('Skill', s.skill, s.group + ' ' + s.evidence, '#craft'); });
    list('SERVICES').forEach(function (s) { add('Service', s.service, s.description, '#svc-' + slug(s.service)); });
    if (has(P.fridays_title)) add('Event', P.fridays_title, [P.fridays_series, 'friday weekly gospel worship', P.fridays_where, P.fridays_menu].join(' '), '#fridays');
  }
  function initSearch() {
    buildIndex();
    var d = $('#searchDialog'), input = $('#searchInput'), out = $('#searchResults');
    function open() { d.showModal(); input.value = ''; draw(''); input.focus(); }
    function draw(q) {
      q = q.trim().toLowerCase();
      var hits = !q ? [] : INDEX.filter(function (r) { return q.split(/\s+/).every(function (w) { return r.hay.indexOf(w) > -1; }); }).slice(0, 12);
      out.innerHTML = hits.map(function (h) { return '<li><a href="' + esc(h.href) + '"><span class="meta">' + esc(h.type) + '</span>' + esc(h.label) + '</a></li>'; }).join('') ||
        (q ? '<li class="muted" style="padding:.7rem .5rem">Nothing found for “' + esc(q) + '”.</li>' : '');
    }
    $('#searchOpen').onclick = open;
    input.addEventListener('input', function () { draw(input.value); });
    out.addEventListener('click', function (e) { if (e.target.closest('a')) d.close(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); open(); }
    });
  }

  function initNav() {
    var nav = $('.nav'), btn = $('#menuBtn'), links = $$('#navLinks a');
    btn.addEventListener('click', function () {
      var o = nav.classList.toggle('open'); btn.setAttribute('aria-expanded', o);
      document.body.style.overflow = o ? 'hidden' : '';
    });
    links.forEach(function (a) { a.addEventListener('click', function () { nav.classList.remove('open'); btn.setAttribute('aria-expanded', false); document.body.style.overflow = ''; }); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && nav.classList.contains('open')) btn.click(); });

    // Scroll-spy: highlight where the visitor is
    var map = {}; links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting && map[e.target.id]) { links.forEach(function (l) { l.classList.remove('active'); l.removeAttribute('aria-current'); });
          map[e.target.id].classList.add('active'); map[e.target.id].setAttribute('aria-current', 'true'); }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    Object.keys(map).forEach(function (id) { var s = document.getElementById(id); if (s) spy.observe(s); });

    var prog = $('#navProgress'), hero = $('#heroPhoto'), tl = $('#timeline'), ticking = false;
    function onScroll() {
      var y = window.scrollY, h = document.documentElement.scrollHeight - innerHeight;
      nav.classList.toggle('scrolled', y > 40);
      prog.style.transform = 'scaleX(' + (h > 0 ? y / h : 0) + ')';
      if (!REDUCED && y < innerHeight && (y > 0 || hero.style.transform)) hero.style.transform = 'translate3d(0,' + (y * 0.22) + 'px,0)';
      if (tl) {
        var r = tl.getBoundingClientRect(), pr = Math.min(1, Math.max(0, (innerHeight * 0.6 - r.top) / r.height));
        var bar = tl.querySelector('.tl-progress'); if (bar) bar.style.height = (pr * 100) + '%';
      }
      ticking = false;
    }
    window.addEventListener('scroll', function () { if (!ticking) { requestAnimationFrame(onScroll); ticking = true; } }, { passive: true });
    onScroll();
  }

  function initReveal() {
    if (REDUCED || !('IntersectionObserver' in window)) { $$('.reveal').forEach(function (el) { el.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        var tlItem = e.target.closest('.tl'); if (tlItem) tlItem.classList.add('in');
        $$('[data-count]', e.target).forEach(countUp);
        io.unobserve(e.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    $$('.reveal').forEach(function (el, i) {
      if (!el.closest('.hero')) el.style.transitionDelay = ((i % 4) * 70) + 'ms';
      io.observe(el);
    });
  }
  function countUp(el) {
    if (el.getAttribute('data-plain') === '1' || REDUCED) return;
    var end = +el.getAttribute('data-count'), t0 = null, dur = 1400;
    function step(ts) { if (!t0) t0 = ts; var p = Math.min(1, (ts - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  function initStrings() {
    if (REDUCED) return;
    $$('.strings').forEach(function (s) {
      function pluck() { s.classList.remove('pluck'); void s.getBoundingClientRect(); s.classList.add('pluck'); }
      s.parentNode.addEventListener('pointerenter', pluck);
      setTimeout(pluck, 1600);
    });
  }

  /* ================= MOBILE ================= */
  function initMobile() {
    var mq = window.matchMedia('(max-width: 720px)');
    var RAILS = [['#musicGrid', 'releases'], ['#artistGrid', 'artists'], ['#peopleList', 'people'],
                 ['#projects', 'projects'], ['#eventList', 'events']];
    var hints = [];

    function count(el) { return $$(':scope > *', el).filter(function (c) { return !c.hidden; }).length; }
    function apply() {
      var on = mq.matches;
      // Swipe rails
      hints.forEach(function (h) { h.remove(); }); hints = [];
      RAILS.forEach(function (r) {
        var el = $(r[0]); if (!el) return;
        el.classList.toggle('rail', on && count(el) > 1);
        if (on && count(el) > 1) {
          var h = document.createElement('div');
          h.className = 'swipe-hint'; h.setAttribute('aria-hidden', 'true');
          h.innerHTML = '<span>' + count(el) + ' ' + r[1] + '</span><b>Swipe →</b>';
          el.parentNode.insertBefore(h, el); hints.push(h);
        }
      });
      // Chapters: first paragraph + "continue reading"
      $$('.chapter').forEach(function (ch) {
        var paras = $$('.chapter-body p', ch);
        var btn = $('.read-more', ch);
        if (paras.length < 2) return;
        if (!btn) {
          btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'read-more';
          btn.addEventListener('click', function () {
            var open = ch.classList.toggle('collapsed') === false;
            btn.setAttribute('aria-expanded', open);
            btn.textContent = open ? 'Show less ↑' : 'Continue reading ↓';
            if (!open) ch.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
          });
          $('.chapter-body', ch).after(btn);
        }
        ch.classList.toggle('collapsed', on);
        btn.setAttribute('aria-expanded', !on);
        btn.textContent = 'Continue reading ↓';
      });
      // Skills: accordion, first group open
      $$('.strip').forEach(function (s, i) {
        var head = $('.strip-head', s);
        if (!head.hasAttribute('data-acc')) {
          head.setAttribute('data-acc', '1');
          head.addEventListener('click', function () { if (mq.matches) toggle(s); });
          head.addEventListener('keydown', function (e) { if (mq.matches && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(s); } });
        }
        if (on) { head.setAttribute('role', 'button'); head.tabIndex = 0; s.classList.toggle('open', i === 0); head.setAttribute('aria-expanded', i === 0); }
        else { head.removeAttribute('role'); head.removeAttribute('tabindex'); s.classList.add('open'); }
      });
    }
    function toggle(s) { var o = s.classList.toggle('open'); $('.strip-head', s).setAttribute('aria-expanded', o); }

    // Filters change card counts — keep hints accurate
    $$('.filters').forEach(function (f) { f.addEventListener('click', function () { setTimeout(apply, 0); }); });
    if (mq.addEventListener) mq.addEventListener('change', apply); else mq.addListener(apply);
    apply();

    // Bottom tab bar: highlight the current section
    var tabs = $$('.tabbar a');
    var ids = { home: '', story: 'story', people: 'story', music: 'music', services: 'services', fridays: 'services', partners: 'contact', artists: 'story', bands: 'story', craft: 'story',
                events: 'story', milestones: 'story', next: 'contact', legacy: 'contact', contact: 'contact' };
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var key = ids[e.target.id];
        tabs.forEach(function (t) { var on = t.getAttribute('href') === '#' + key; t.classList.toggle('active', on); if (on) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current'); });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    Object.keys(ids).forEach(function (id) { var s = document.getElementById(id); if (s) spy.observe(s); });
    var more = $('#tabMore'); if (more) more.addEventListener('click', function () { $('#menuBtn').click(); });
  }

  /* ================= BOOT ================= */
  function boot() {
    [renderHero, renderStats, renderChapters, renderPeople, renderMusic, renderServices, renderFridays, renderArtists, renderBands,
     renderSkills, renderEvents, renderTimeline, renderProjects, renderPartners, renderContact, initJoin, trackVisit,
     initNav, initReveal, initLightbox, initSearch, initStrings, initMobile].forEach(function (fn) {
      try { fn(); } catch (err) { console.error(fn.name, err); }   // one bad row never blanks the whole site
    });
    requestAnimationFrame(function () { document.body.classList.add('loaded'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
